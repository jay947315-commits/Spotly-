<script>
/* ==========================================================================
   ÜBERSICHT – WO LIEGT WAS?
   1. EINSTELLUNGEN   (Block "EINSTELLUNGEN")
   2. KARTEN-ADAPTER  (Block "KARTEN-ADAPTER")  – HIER DEIN 3D-KARTENSKRIPT EINFÜGEN
   3. NAVIGATION      (Block "NAVIGATION")      – läuft nur über den Adapter
   Bildqualität ist FEST (für alle gleich): 1600 px, WebP 82 %, Vorschau 480 px.
   Alles bleibt lokal auf dem Gerät.
   ========================================================================== */
/* #####################################################################
   ##   KARTEN-ADAPTER  –  HIER LIEGT DEINE KARTE   (Suche: KARTEN-ADAPTER)
   #####################################################################
   Deine MapLibre-3D-Karte (Carto Dark Matter, Gebäude in echter Höhe) ist in MapLibreMap eingebaut.
   Die Bibliothek wird oben im <head> geladen. Fehlt sie oder lässt sich die Karte nicht laden
   (offline, kein WebGL), schaltet die App automatisch auf FallbackMap (einfache Platzhalter-Karte) um.
   Anpassen kannst du in MapLibreMap: Stil-URLs (ST), Startposition/Zoom/Neigung (in mount),
   Gebäudehöhe (HH und HB) und die Farben der Gebäude (addBuildings).
   Die App spricht nur diese Methoden an (alle Koordinaten als lat, lng):
     name, mount(el,cb,onFail), setCenter, flyTo, render(items,selId,me,draftPt), route(points), setStyle(name), resize
   ===================================================================== */
var FallbackMap=(function(){
  var el,cb,world,C={lat:52.52,lng:13.405},M=.25,off={x:0,y:0},last=[],rt=null;
  function ll2px(lat,lng){return{x:1600+(lng-C.lng)*111320*Math.cos(C.lat*Math.PI/180)*M,y:1600-(lat-C.lat)*111320*M}}
  function px2ll(x,y){return{lat:C.lat+(1600-y)/M/111320,lng:C.lng+(x-1600)/M/(111320*Math.cos(C.lat*Math.PI/180))}}
  function place(){world.style.transform="translate("+(el.clientWidth/2-1600+off.x)+"px,"+(el.clientHeight/2-1600+off.y)+"px)"}
  function bg(){var r=['<svg width="3200" height="3200" style="position:absolute;left:0;top:0"><rect width="3200" height="3200" fill="var(--map)"/><path d="M0 2300C500 2000 900 2500 1500 2100S2600 1700 3200 2000V2300C2600 2000 2000 2400 1500 2350S500 2600 0 2500Z" fill="var(--water)"/>'],i;
    for(i=0;i<9;i++)r.push('<rect x="'+(250+i*330)+'" y="'+(300+i%3*500)+'" width="'+(160+i%4*40)+'" height="'+(140+i%3*60)+'" rx="40" fill="var(--green)"/>');
    for(i=0;i<22;i++)r.push('<path d="M'+i*150+' 0V3200M0 '+i*150+'H3200" stroke="var(--road)" stroke-width="'+(i%4?7:14)+'"/>');
    r.push('<path d="M0 600 3200 2600" stroke="var(--road)" stroke-width="16"/>');
    if(rt){var pp=rt.map(function(p){var q=ll2px(p.lat,p.lng);return q.x+","+q.y}).join(" ");r.push('<polyline fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" points="'+pp+'"/><polyline fill="none" stroke="#2f7cf6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" points="'+pp+'"/>');var q0=ll2px(rt[0].lat,rt[0].lng);r.push('<circle cx="'+q0.x+'" cy="'+q0.y+'" r="13" fill="#fff"/><circle cx="'+q0.x+'" cy="'+q0.y+'" r="8" fill="#2f7cf6"/>')}
    r.push('</svg>');return r.join("")}
  return{name:"Standard (2D-Platzhalter)",
    mount:function(e,c){el=e;cb=c;world=document.createElement("div");world.id="world";el.appendChild(world);var d=null,mv=0;
      el.addEventListener("pointerdown",function(ev){d={x:ev.clientX,y:ev.clientY,ox:off.x,oy:off.y};mv=0;el.setPointerCapture(ev.pointerId)});
      el.addEventListener("pointermove",function(ev){if(!d)return;var dx=ev.clientX-d.x,dy=ev.clientY-d.y;mv=Math.max(mv,Math.abs(dx)+Math.abs(dy));off.x=Math.max(-1400,Math.min(1400,d.ox+dx));off.y=Math.max(-1400,Math.min(1400,d.oy+dy));place()});
      el.addEventListener("pointerup",function(ev){if(d&&mv<6){var r=el.getBoundingClientRect(),l=px2ll(ev.clientX-r.left-(el.clientWidth/2-1600+off.x),ev.clientY-r.top-(el.clientHeight/2-1600+off.y));cb.tap(l.lat,l.lng)}d=null});place()},
    setCenter:function(a,b){C={lat:a,lng:b};off={x:0,y:0};place();if(last.length)this.render.apply(this,last)},
    flyTo:function(a,b){var p=ll2px(a,b);off={x:1600-p.x,y:1600-p.y};world.style.transition="transform .55s ease";place();setTimeout(function(){world.style.transition=""},580)},
    route:function(p){rt=p;if(last.length)this.render.apply(this,last)},
    render:function(items,selId,me,dp){last=[items,selId,me,dp];world.innerHTML=bg();
      items.forEach(function(s){var p=ll2px(s.lat,s.lng),e=document.createElement("div");e.className="pin"+(selId===s.id?" sel":"")+(s.type?" t-"+s.type:"");e.style.left=p.x+"px";e.style.top=p.y+"px";e.innerHTML=s.html;
        e.addEventListener("pointerup",function(ev){ev.stopPropagation()});e.onclick=function(ev){ev.stopPropagation();cb.pin(s.id)};world.appendChild(e)});
      if(me){var p=ll2px(me.lat,me.lng),m=document.createElement("div");m.className="me";m.style.left=p.x+"px";m.style.top=p.y+"px";world.appendChild(m)}
      if(dp){var q=ll2px(dp.lat,dp.lng),n=document.createElement("div");n.className="pin sel";n.style.left=q.x+"px";n.style.top=q.y+"px";world.appendChild(n)}},
    resize:function(){place()}}})();

var MapLibreMap=(function(){
  var m=null,cb=null,fail=null,mk=[],rt=null,styleOk=false,offline=false,sty="dark",cen={lat:47.9990,lng:7.8421},gen=null,ctl=null,at=null;
  var ST={dark:"https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",light:"https://basemaps.cartocdn.com/gl/positron-gl-style/style.json"};
  /* Gebäudehöhe: erst render_height, dann height, dann Stockwerke mal 3,5 m, sonst 10 m */
  var HH=["case",["has","render_height"],["to-number",["get","render_height"],10],["has","height"],["to-number",["get","height"],10],["has","building:levels"],["*",["to-number",["get","building:levels"],3],3.5],10];
  var HB=["case",["has","render_min_height"],["to-number",["get","render_min_height"],0],["has","min_height"],["to-number",["get","min_height"],0],0];
  /* Offline-Demo: Wenn der Kartenserver nicht erreichbar ist, wird eine Stadt aus Demo-Gebäuden erzeugt (3D, mit Höhen). */
  function rnd(a,b){var x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)}
  function rect(a,b,c,d,p){return{type:"Feature",properties:p,geometry:{type:"Polygon",coordinates:[[[b,a],[d,a],[d,c],[b,c],[b,a]]]}}}
  function city(lat,lng){var dl=.00085,dg=dl/Math.cos(lat*Math.PI/180),N=11,i0=Math.round(lat/dl),j0=Math.round(lng/dg),f=[],i,j,k;
    for(i=i0-N;i<=i0+N;i++)for(j=j0-N;j<=j0+N;j++){var la=i*dl,lo=j*dg,r0=rnd(i,j);
      if(r0<.09){f.push(rect(la+dl*.14,lo+dg*.14,la+dl*.86,lo+dg*.86,{k:"park"}));continue}
      for(k=0;k<4;k++){var qa=k>>1,qb=k&1,rr=rnd(i*7+k,j*13+k),a=la+dl*(.12+qa*.40+rr*.04),c=la+dl*(.46+qa*.40-rnd(j,i+k)*.04),b=lo+dg*(.12+qb*.40+rr*.04),d=lo+dg*(.46+qb*.40-rnd(i+k,j)*.04);
        var h=(r0>.9&&k===0)?40+rnd(i,j+k)*50:7+rr*20+(rnd(i+k,j+3)>.88?18:0);f.push(rect(a,b,c,d,{k:"b",h:Math.round(h)}))}}
    for(i=i0-N;i<=i0+N+1;i++)f.push({type:"Feature",properties:{k:"road",w:i%4===0?2:1},geometry:{type:"LineString",coordinates:[[(j0-N)*dg,i*dl],[(j0+N+1)*dg,i*dl]]}});
    for(j=j0-N;j<=j0+N+1;j++)f.push({type:"Feature",properties:{k:"road",w:j%4===0?2:1},geometry:{type:"LineString",coordinates:[[j*dg,(i0-N)*dl],[j*dg,(i0+N+1)*dl]]}});
    gen={lat:lat,lng:lng};return{type:"FeatureCollection",features:f}}
  function offStyle(){var L=sty==="light",R=["==",["get","k"],"road"];
    return{version:8,sources:{demo:{type:"geojson",data:city(cen.lat,cen.lng)}},layers:[
      {id:"bg",type:"background",paint:{"background-color":L?"#e9ecf0":"#12151a"}},
      {id:"park",type:"fill",source:"demo",filter:["==",["get","k"],"park"],paint:{"fill-color":L?"#d3e6cf":"#1b2a22"}},

function sunInfo(){var p=ref(),a=sunAt(p.lat,p.lng,-.833),g=sunAt(p.lat,p.lng,6),b=sunAt(p.lat,p.lng,-6);if(!a||!g||!b)return null;
  var ev=[[b[0],"Blaue Stunde beginnt"],[a[0],"Sonnenaufgang"],[g[0],"Goldene Stunde endet"],[g[1],"Goldene Stunde beginnt"],[a[1],"Sonnenuntergang"],[b[1],"Blaue Stunde endet"]],now=Date.now(),nx=null;
  for(var i=0;i<ev.length;i++)if(ev[i][0]>now){nx=ev[i];break}
  if(!nx){var a2=sunAt(p.lat,p.lng,-.833,1);nx=a2?[a2[0],"Sonnenaufgang morgen"]:null}
  return{rise:a[0],set:a[1],nx:nx,f:(now-a[0])/(a[1]-a[0])}}
function arc(si){var t=Math.max(0,Math.min(1,si.f)),u=1-t,x=u*u*10+2*u*t*150+t*t*290,y=u*u*80+2*u*t*-50+t*t*80,day=si.f>=0&&si.f<=1;
  return '<svg class="arc" viewBox="0 0 300 100"><path d="M0 80H300" stroke="#14161a22" stroke-width="2"/><path d="M10 80Q150 -50 290 80" fill="none" stroke="#14161a44" stroke-width="3" stroke-dasharray="3 8" stroke-linecap="round"/><circle cx="'+x+'" cy="'+y+'" r="'+(day?11:7)+'" fill="'+(day?"#fff":"#14161a")+'" opacity="'+(day?1:.35)+'"/></svg>'}
function drawWidgets(){var wg=$("wg");if(!wg)return;var p=ref(),si=sunInfo(),n=near()[0],all=spots.filter(function(s){return dist(p,s)<=CFG.radius*1000}),k=all.filter(function(s){return s.type==="Kamera"}).length;
  wg.innerHTML=
   '<div class="w w-gold"><div class="wt"><span>'+ic("sun",16)+'Licht heute</span>'+(si?'<small>'+fmtT(si.rise)+' – '+fmtT(si.set)+'</small>':'')+'</div><div class="wb">'+(si&&si.nx?'<b>in '+inT(si.nx[0]-Date.now())+'</b><small>'+si.nx[1]+'</small>':'<small>Für diesen Ort nicht verfügbar</small>')+'</div>'+(si?arc(si):'')+'</div>'+
   '<div class="w w-near" data-w="near"><div class="wt"><span>'+ic("pin",16)+'Nächster Spot</span></div>'+(n?'<div class="cmp" style="transform:rotate('+bearing(p,n)+'deg)">'+ic("arrowup",22)+'</div><div class="wb"><b>'+fd(dist(p,n))+'</b><small>'+esc(n.title)+'</small></div>':'<div class="wb"><small>Noch keiner im Umkreis</small></div>')+'</div>'+
   '<div class="w w-stat"><div class="wt"><span>'+ic("image",16)+'Im Umkreis</span></div><div class="wb"><b>'+all.length+'</b><small>'+k+' Kamera · '+(all.length-k)+' Drohne</small></div></div>'+
   '<div class="w w-quick"><button data-q="add">'+ic("upload",22)+'<span>Hochladen</span></button><button data-q="loc">'+ic("locate",22)+'<span>Standort</span></button><button data-q="go">'+ic("go",22)+'<span>Navigation</span></button></div>';
  wg.querySelector('[data-w=near]').onclick=function(){if(n){show("map");openDetail(n.id)}};
  Array.prototype.forEach.call(wg.querySelectorAll("[data-q]"),function(b){b.onclick=function(){var q=b.dataset.q;if(q==="add")openAdd();else if(q==="loc")$("loc-btn").click();else if(n)startNav(n);else notify("Kein Spot","Im Umkreis gibt es noch keinen Spot.")}})}
var TAGS=["Alle","Natur","Stadt","Wasser","Berge"],tagF="Alle",FAV={};try{FAV=JSON.parse(localStorage.getItem("spotly-fav")||"{}")||{}}catch(e){}
function saveFav(){try{localStorage.setItem("spotly-fav",JSON.stringify(FAV))}catch(e){}}
function tipHTML(s){var a=sunAt(s.lat,s.lng,-.833),g=sunAt(s.lat,s.lng,6),h="";
  if(a&&g)h='<div class="lt"><div class="ic3">'+ic("sun",20)+'</div><div><b>Beste Lichtzeiten heute</b><small>Morgens '+fmtT(a[0])+' – '+fmtT(g[0])+' · Abends '+fmtT(g[1])+' – '+fmtT(a[1])+'</small></div></div>';
  if(s.tip)h='<div class="lt tp2"><div class="ic3">'+ic("info",20)+'</div><div><b>Tipp</b><small>'+esc(s.tip)+'</small></div></div>'+h;return h}
var WH=[["#a9f5a0","heart","Merken","Speichere Lieblings-Spots mit dem Herz und finde sie über den Filter Gemerkt."],["#d9c9f5","pin","Kategorien und Tipps","Natur, Stadt, Wasser oder Berge. Dazu ein Tipp zu Zugang und bester Zeit bei jedem Spot."],["#ffe0a8","sun","Licht am Spot","Die besten Lichtzeiten für jeden Spot, direkt im Detail."],["#bde0fe","map","3D-Karte","Gebäude stehen auf der Karte in echter Höhe. Neigen mit zwei Fingern."]];
function openWhats(){$("whats").innerHTML='<div class="grab"></div><h2 style="margin:6px 0 4px;font-size:26px;font-weight:700;letter-spacing:-.6px">Neu in Spotly '+APP.ver+'</h2><div class="meta" style="margin:0 0 16px">Das hat sich geändert</div>'+WH.map(function(x){return'<div class="wrow" style="background:'+x[0]+'"><div class="ic3">'+ic(x[1],20)+'</div><div><b>'+x[2]+'</b><small>'+x[3]+'</small></div></div>'}).join("")+'<button class="btn" id="wh-x" style="margin-top:10px">Los geht\'s</button>';$("whats").classList.add("open");scrim();$("wh-x").onclick=closeTop}
function refresh(){draw();drawList();drawWidgets()}

/* ================================ UPLOAD ================================ */
function chk(){$("a-save").disabled=!(draft.img&&$("a-model").value.trim()&&draft.lat!==null&&$("a-title").value.trim());$("a-loc").className="loc "+(draft.lat!==null?"ok":"bad");
  $("a-loctxt").textContent=draft.lat!==null?draft.lat.toFixed(5)+"° N, "+draft.lng.toFixed(5)+"° E"+(draft.exif?" (aus Foto)":""):"Noch kein Standort gesetzt"}
function dropReset(){$("drop").innerHTML='<div style="display:grid;gap:8px;justify-items:center">'+ic("image",30)+'Foto auswählen</div>'}
function drawTypes(){$("a-type").innerHTML=chipsHTML(CH.slice(1),draft.t);bindChips($("a-type"),function(t){draft.t=t;drawTypes()});$("a-tag").innerHTML=chipsHTML(TAGS.slice(1).map(function(x){return[x]}),draft.tag);bindChips($("a-tag"),function(t){draft.tag=t;drawTypes()})}
function openAdd(){show("map",true);$("add").classList.add("open");scrim();drawTypes();chk();draw()}
function closeAdd(){$("add").classList.remove("open");scrim();draw()}
function exifGPS(buf){try{var v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;var o=2,i,e;
  while(o<v.byteLength-4){var m=v.getUint16(o),l=v.getUint16(o+2);
    if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){var t=o+10,le=v.getUint16(t)===0x4949,u16=function(p){return v.getUint16(t+p,le)},u32=function(p){return v.getUint32(t+p,le)};
      var ifd=u32(4),n=u16(ifd),gp=0;for(i=0;i<n;i++){e=ifd+2+i*12;if(u16(e)===0x8825)gp=u32(e+8)}
      if(!gp)return null;var g={},c=u16(gp);
      for(i=0;i<c;i++){e=gp+2+i*12;var tg=u16(e),off=u32(e+8);
        if(tg===1||tg===3)g[tg]=String.fromCharCode(v.getUint8(t+e+8));
        else if(tg===2||tg===4){var d=[];for(var q=0;q<3;q++)d.push(u32(off+q*8)/u32(off+q*8+4));g[tg]=d[0]+d[1]/60+d[2]/3600}}
      if(g[2]==null||g[4]==null)return null;return{lat:g[1]==="S"?-g[2]:g[2],lng:g[3]==="W"?-g[4]:g[4]}}
    o+=2+l}}catch(x){}return null}
function loadImg(f){return new Promise(function(ok,no){var im=new Image();im.onload=function(){ok(im)};im.onerror=no;im.src=URL.createObjectURL(f)})}
function bmp(f){return window.createImageBitmap?createImageBitmap(f,{imageOrientation:"from-image"}).catch(function(){return loadImg(f)}):loadImg(f)}
function shrink(im,px,q){var c=document.createElement("canvas"),k=Math.min(1,px/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL(WEBP?"image/webp":"image/jpeg",q)}
function pickFile(f){if(!f)return;$("drop").innerHTML='<div class="meta">Foto wird verarbeitet …</div>';
  var gp=f.slice(0,262144).arrayBuffer().then(exifGPS).catch(function(){return null});
  Promise.all([bmp(f),gp]).then(function(r){draft.img=shrink(r[0],FULL,FQ);draft.th=shrink(r[0],THUMB,TQ);$("drop").innerHTML='<img src="'+draft.th+'" alt="">';
    if(r[1]&&draft.lat===null){draft.lat=r[1].lat;draft.lng=r[1].lng;draft.exif=true}chk();draw()}).catch(function(){dropReset();toast("Dieses Bildformat wird nicht unterstützt. Bitte JPEG oder PNG wählen.")})}
$("file").onchange=$("cam").onchange=function(e){pickFile(e.target.files[0]);e.target.value=""};
$("a-title").oninput=$("a-model").oninput=chk;
$("a-gps").innerHTML=ic("locate",15)+"GPS";$("a-pick").innerHTML=ic("map",15)+"Karte";
function gotMe(p){ME={lat:p.coords.latitude,lng:p.coords.longitude};BASE=ME;var mine=spots.filter(function(s){return s.mine});spots=mkSeed().concat(mine);MapAdapter.setCenter(ME.lat,ME.lng);refresh()}
$("a-gps").onclick=function(){if(!navigator.geolocation)return toast("GPS nicht verfügbar. Wähle den Ort über „Karte“.");navigator.geolocation.getCurrentPosition(function(p){gotMe(p);draft.lat=p.coords.latitude;draft.lng=p.coords.longitude;draft.exif=false;chk();draw()},function(){toast("Standort nicht freigegeben. Wähle den Ort über „Karte“.")},{enableHighAccuracy:true,timeout:8000})};
$("a-pick").onclick=function(){closeAdd();picking=true;var h=$("hint");h.textContent="Tippe auf die Karte für den Foto-Standort";h.classList.add("on")};
$("a-cancel").onclick=function(){picking=false;closeAdd()};
$("a-save").onclick=function(){if(draft.lat===null||!draft.img)return;
  var s={id:"u"+Date.now(),title:$("a-title").value.trim(),type:draft.t,tag:draft.tag,tip:$("a-tip").value.trim(),cam:$("a-model").value.trim(),lat:draft.lat,lng:draft.lng,img:draft.img,th:draft.th,mine:true,t:Math.floor(Date.now()/1000)};
  spots.push(s);idbPut(s.id,s.img);saveS();
  draft={lat:null,lng:null,img:null,th:null,t:"Kamera",tag:"Natur"};dropReset();$("a-title").value=$("a-model").value=$("a-tip").value="";closeAdd();refresh();openDetail(s.id)};
function saveS(){try{localStorage.setItem("spotly-s",JSON.stringify(spots.filter(function(s){return s.mine}).map(function(s){var c={};for(var k in s)if(k!=="img")c[k]=s[k];return c})))}catch(e){toast("Speicher voll. Aktiviere den Server oder lösche lokale Daten.")}}

function show(t,keep){Array.prototype.forEach.call(document.querySelectorAll(".screen"),function(s){s.classList.remove("on")});$("s-"+t).classList.add("on");
  Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.classList.toggle("on",b.dataset.tab===t)});
  if(!keep){picking=false;$("hint").classList.remove("on");$("add").classList.remove("open");closeDetail()}
  if(t==="list")drawList();if(t==="set")drawSet();if(t==="map")MapAdapter.resize()}
Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.onclick=function(){b.dataset.tab==="add"?openAdd():show(b.dataset.tab)}});
$("q").oninput=refresh;$("q2").oninput=function(){$("q").value=this.value;refresh()};$("flt").onclick=function(){show("set")};
$("loc-btn").onclick=function(){if(ME)return MapAdapter.flyTo(ME.lat,ME.lng);askLoc()};

icons();dropReset();
var mine=[];try{mine=migrate(JSON.parse(localStorage.getItem("spotly-s")||"[]"));localStorage.setItem("spotly-v",APP.data)}catch(e){}
spots=mkSeed().concat(mine);
applyCfg();MapAdapter.setCenter(BASE.lat,BASE.lng);refresh();
window.addEventListener("resize",function(){MapAdapter.resize()});setInterval(drawWidgets,60000);window.addEventListener("offline",function(){notify("Du bist offline","Gespeicherte Spots bleiben verfügbar.")});window.addEventListener("online",function(){notify("Wieder online")});
$("imp").onchange=function(e){var f=e.target.files[0];e.target.value="";if(f)importData(f)};
try{if(!localStorage.getItem("spotly-ob"))openOB();else if(localStorage.getItem("spotly-seen")!==APP.ver)openWhats();localStorage.setItem("spotly-seen",APP.ver)}catch(e){}
window.addEventListener("error",function(){toast("Etwas ist schiefgelaufen. Bitte erneut versuchen.")});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){var had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(function(r){SWREG=r;setInterval(function(){r.update().catch(function(){})},1800000);document.addEventListener("visibilitychange",function(){if(!document.hidden)r.update().catch(function(){})})}).catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(had&&CFG.updOn)alertUser("Spotly wurde aktualisiert","Version "+APP.ver+" ist bereit.","upd",{act:"Neu laden",fn:function(){location.reload()}})})}
window.Spotly={version:APP.ver,cfg:CFG,refresh:refresh,toast:toast,get spots(){return spots}};

</script></body></html>
